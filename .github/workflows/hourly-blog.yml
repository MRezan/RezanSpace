name: Hourly all-category publishing
run-name: ${{ inputs.dry_run && 'Preview — 16 categories × 15 languages' || 'Live — 16 categories × 15 languages' }}
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview all categories and languages without publishing'
        type: boolean
        default: true
      resume_run_id:
        description: 'Reuse completed category artifacts from an earlier main-branch hourly run'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: rezan-hourly-category-batch
  cancel-in-progress: false
  queue: max

env:
  BLOG_WORK_DIR: work/blog
  REZAN_SITE_URL: https://rezan.space
  NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/automation/certs/google-wr1.pem
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  HF_HUB_DISABLE_XET: '1'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  CPU_IMAGE_WIDTH: '1024'
  CPU_IMAGE_HEIGHT: '576'
  CPU_IMAGE_STEPS: '16'
jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTO_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      topics: ${{ steps.plan.outputs.topics }}
      resume_originals: ${{ steps.resume.outputs.originals || '[]' }}
      resume_progress: ${{ steps.resume.outputs.progress || '[]' }}
      resume_covers: ${{ steps.resume.outputs.covers || '[]' }}
      resume_languages: ${{ steps.resume.outputs.languages || '[]' }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: pip install -r automation/requirements.txt
      - run: python -m unittest discover -s automation/tests -v
      - name: Verify FTPS before spending generation time
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        env:
          REZAN_FTP_HOST: ${{ secrets.REZAN_FTP_HOST }}
          REZAN_FTP_USER: ${{ secrets.REZAN_FTP_USER }}
          REZAN_FTP_PASSWORD: ${{ secrets.REZAN_FTP_PASSWORD }}
          REZAN_FTP_DIRECTORY: rezan.space/htdocs
        run: python automation/deploy.py --check
      - name: Export the live database and verify publishing readiness
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        env:
          REZAN_AUTOMATION_KEY: ${{ secrets.REZAN_AUTOMATION_KEY }}
        run: |
          npm ci --prefix automation
          npx --prefix automation playwright install --with-deps chromium
          node automation/delivery.mjs preflight
      - name: Initialize a preview snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: mkdir -p work/blog && printf '[]' > work/blog/snapshot.json
      - name: Validate the recovery source and reusable category outputs
        if: inputs.resume_run_id != ''
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: python automation/resume_batch.py
      - name: Reuse the source run's complete category evidence plan
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: batch-plan
          path: work/blog
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Restore this batch's source plan when retrying
        if: github.run_attempt > 1
        continue-on-error: true
        uses: actions/download-artifact@v7
        with: {name: batch-plan, path: work/blog}
      - name: Require distinct, unpublished evidence for every category
        id: plan
        run: python -u automation/batch.py plan
      - uses: actions/upload-artifact@v6
        with:
          name: batch-plan
          path: work/blog
          overwrite: true
          retention-days: 7
  originals:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        topic: ${{ fromJSON(needs.prepare.outputs.topics) }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v7
        with: {name: batch-plan, path: work/blog}
      - name: Reuse the source run's validated original
        if: ${{ inputs.resume_run_id != '' && contains(fromJSON(needs.prepare.outputs.resume_originals), matrix.topic) }}
        uses: actions/download-artifact@v7
        with:
          name: category-original-${{ matrix.topic }}
          path: work/blog
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Restore completed original on retry
        if: github.run_attempt > 1
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: category-original-${{ matrix.topic }}
          path: work/blog
      - name: Restore partial validated sections from the source run
        if: ${{ inputs.resume_run_id != '' && contains(fromJSON(needs.prepare.outputs.resume_progress), format('{0}-en', matrix.topic)) }}
        uses: actions/download-artifact@v7
        with:
          name: category-progress-${{ matrix.topic }}-en
          path: work/blog
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Restore partial validated sections on retry
        if: github.run_attempt > 1
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: category-progress-${{ matrix.topic }}-en
          path: work/blog
      - uses: actions/cache@v5
        if: ${{ !contains(fromJSON(needs.prepare.outputs.resume_originals), matrix.topic) }}
        with:
          path: .cache/huggingface/hub/models--unsloth--Qwen3-4B-Instruct-2507-GGUF
          key: qwen-a06e946bb6b655725eafa393f4a9745d460374c9-cpu-v1
      - name: Generate and evidence-review the English original
        env: {TOPIC: '${{ matrix.topic }}'}
        run: |
          pip install -r automation/requirements.txt
          if [ ! -f "work/blog/topics/$TOPIC/en.json" ]; then pip install -r automation/requirements-text.txt; fi
          python -u automation/blog.py english --work "work/blog/topics/$TOPIC"
          mkdir -p "artifact/topics/$TOPIC"
          cp "work/blog/topics/$TOPIC/manifest.json" "work/blog/topics/$TOPIC/en.json" "artifact/topics/$TOPIC/"
      - uses: actions/upload-artifact@v6
        with:
          name: category-original-${{ matrix.topic }}
          path: artifact
          overwrite: true
          retention-days: 7
      - name: Preserve validated sections even when generation fails
        if: always()
        env:
          TOPIC: ${{ matrix.topic }}
          LANGUAGE: en
        run: |
          if [ -f "work/blog/topics/$TOPIC/$LANGUAGE.progress.json" ]; then
            mkdir -p "progress-artifact/topics/$TOPIC"
            cp "work/blog/topics/$TOPIC/$LANGUAGE.progress.json" "progress-artifact/topics/$TOPIC/"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: category-progress-${{ matrix.topic }}-en
          path: progress-artifact
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  generation:
    # Images and translations share one pool; no image-completion barrier.
    # English is already in category-original artifacts, avoiding 16 copy jobs.
    needs: [prepare, originals]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        topic: ${{ fromJSON(needs.prepare.outputs.topics) }}
        language: [cover, es, pt-BR, hi, id, ar, fr, de, ja, bn, vi, tr, ko, it, pl]
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v7
        with:
          name: category-original-${{ matrix.topic }}
          path: work/blog
      - name: Reuse the source run's completed illustration
        if: ${{ matrix.language == 'cover' && inputs.resume_run_id != '' && contains(fromJSON(needs.prepare.outputs.resume_covers), matrix.topic) }}
        uses: actions/download-artifact@v7
        with:
          name: category-cover-${{ matrix.topic }}
          path: work/blog
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Restore completed illustration on retry
        if: ${{ matrix.language == 'cover' && github.run_attempt > 1 }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: category-cover-${{ matrix.topic }}
          path: work/blog
      - name: Generate the category illustration on its own runner
        if: matrix.language == 'cover'
        env: {TOPIC: '${{ matrix.topic }}'}
        run: |
          if [ ! -f "work/blog/topics/$TOPIC/cover.webp" ]; then
            pip install -r automation/requirements.txt
            pip install --no-cache-dir 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
            pip install --no-cache-dir -r automation/requirements-image.txt
            python -u automation/blog.py image --work "work/blog/topics/$TOPIC"
          fi
          mkdir -p "artifact/topics/$TOPIC"
          cp "work/blog/topics/$TOPIC/cover.webp" "artifact/topics/$TOPIC/"
      - uses: actions/upload-artifact@v6
        if: matrix.language == 'cover'
        with:
          name: category-cover-${{ matrix.topic }}
          path: artifact
          overwrite: true
          retention-days: 7
      - name: Reuse the source run's completed language
        if: ${{ matrix.language != 'cover' && inputs.resume_run_id != '' && contains(fromJSON(needs.prepare.outputs.resume_languages), format('{0}-{1}', matrix.topic, matrix.language)) }}
        uses: actions/download-artifact@v7
        with:
          name: category-language-${{ matrix.topic }}-${{ matrix.language }}
          path: work/blog
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Restore completed language on retry
        if: ${{ matrix.language != 'cover' && github.run_attempt > 1 }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: category-language-${{ matrix.topic }}-${{ matrix.language }}
          path: work/blog
      - name: Restore partial validated sections from the source run
        if: ${{ matrix.language != 'cover' && inputs.resume_run_id != '' && contains(fromJSON(needs.prepare.outputs.resume_progress), format('{0}-{1}', matrix.topic, matrix.language)) }}
        uses: actions/download-artifact@v7
        with:
          name: category-progress-${{ matrix.topic }}-${{ matrix.language }}
          path: work/blog
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Restore partial validated sections on retry
        if: ${{ matrix.language != 'cover' && github.run_attempt > 1 }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: category-progress-${{ matrix.topic }}-${{ matrix.language }}
          path: work/blog
      - uses: actions/cache/restore@v5
        if: ${{ matrix.language != 'cover' && !contains(fromJSON(needs.prepare.outputs.resume_languages), format('{0}-{1}', matrix.topic, matrix.language)) }}
        with:
          path: .cache/huggingface/hub/models--unsloth--Qwen3-4B-Instruct-2507-GGUF
          key: qwen-a06e946bb6b655725eafa393f4a9745d460374c9-cpu-v1
      - name: Translate faithfully and validate the requested language
        if: matrix.language != 'cover'
        env:
          TOPIC: ${{ matrix.topic }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          pip install -r automation/requirements.txt
          if [ ! -f "work/blog/topics/$TOPIC/$LANGUAGE.json" ]; then
            pip install -r automation/requirements-text.txt
            python -u automation/blog.py translate --language "$LANGUAGE" --work "work/blog/topics/$TOPIC"
          fi
          mkdir -p "artifact/topics/$TOPIC"
          cp "work/blog/topics/$TOPIC/$LANGUAGE.json" "artifact/topics/$TOPIC/"
      - uses: actions/upload-artifact@v6
        if: matrix.language != 'cover'
        with:
          name: category-language-${{ matrix.topic }}-${{ matrix.language }}
          path: artifact
          overwrite: true
          retention-days: 7
      - name: Preserve validated sections even when generation fails
        if: ${{ always() && matrix.language != 'cover' }}
        env:
          TOPIC: ${{ matrix.topic }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          if [ -f "work/blog/topics/$TOPIC/$LANGUAGE.progress.json" ]; then
            mkdir -p "progress-artifact/topics/$TOPIC"
            cp "work/blog/topics/$TOPIC/$LANGUAGE.progress.json" "progress-artifact/topics/$TOPIC/"
          fi
      - uses: actions/upload-artifact@v6
        if: ${{ always() && matrix.language != 'cover' }}
        with:
          name: category-progress-${{ matrix.topic }}-${{ matrix.language }}
          path: progress-artifact
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  publish:
    needs: [prepare, originals, generation]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: rezan-live-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/download-artifact@v7
        with: {name: batch-plan, path: work/blog}
      - uses: actions/download-artifact@v7
        with:
          pattern: category-*
          merge-multiple: true
          path: work/blog
      - name: Require complete coverage before publishing any category
        run: |
          pip install -r automation/requirements.txt
          python automation/batch.py assemble
      - name: Save a validated preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v6
        with:
          name: all-category-preview
          path: work/blog
          retention-days: 7
      - name: Publish every category and export all public posts
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        env: {REZAN_AUTOMATION_KEY: '${{ secrets.REZAN_AUTOMATION_KEY }}'}
        run: |
          npm ci --prefix automation
          npx --prefix automation playwright install --with-deps chromium
          node automation/delivery.mjs publish-batch
      - name: Build the latest approved website without discarding generated content
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        uses: actions/checkout@v5
        with:
          ref: main
          clean: false
          persist-credentials: false
      - name: Build all article pages and refresh the complete sitemap
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        env:
          REZAN_POSTS_FILE: work/blog/snapshot.json
          NEXT_PUBLIC_SITE_URL: https://rezan.space
          NEXT_PUBLIC_API_URL: https://rezan.space
        run: |
          npm ci
          npm run build -- --webpack
      - name: Deploy managed files to InfinityFree
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        env:
          REZAN_FTP_HOST: ${{ secrets.REZAN_FTP_HOST }}
          REZAN_FTP_USER: ${{ secrets.REZAN_FTP_USER }}
          REZAN_FTP_PASSWORD: ${{ secrets.REZAN_FTP_PASSWORD }}
          REZAN_FTP_DIRECTORY: rezan.space/htdocs
        run: python automation/deploy.py
      - name: Verify every new article and its sitemap entry
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        run: node automation/delivery.mjs verify
      - name: Summarize full coverage
        run: |
          echo '### All-category publishing' >> "$GITHUB_STEP_SUMMARY"
          echo 'Validated 16 categories × 15 languages (240 articles); generation concurrency is capped at 20.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Live mode verifies deployed article pages and every new sitemap URL. Preview mode never publishes.' >> "$GITHUB_STEP_SUMMARY"
