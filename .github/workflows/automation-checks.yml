name: Blog automation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: |
          pip install -r automation/requirements.txt
          python -m unittest discover -s automation/tests -v
          node --check automation/delivery.mjs
          php -l backend/lib/site-publish.php
          php -l backend/api/automation-media.php
          php -l backend/api/automation-health.php
          php -l backend/lib/automation-auth.php
      - run: |
          npm ci
          npm run test:categories
          node --test tests/sitemap-limits.test.mjs
          php -l backend/api/categories.php
          php -l backend/api/posts.php
          npm run test:i18n
