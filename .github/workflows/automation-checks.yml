name: Blog automation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: |
          pip install -r automation/requirements.txt
          python -m unittest discover -s automation/tests -v
          node --check automation/delivery.mjs
          node --test tests/live-verification.test.mjs
          node --test tests/seo-export-gate.test.mjs
          php -l backend/lib/site-publish.php
          php -l backend/api/automation-media.php
          php -l backend/api/automation-health.php
          php -l backend/lib/automation-auth.php
          php tests/publishing-recovery.php
      - run: |
          npm ci
          npm run test:categories
          npm run test:articles
          node --test tests/sitemap-limits.test.mjs
          php -l backend/api/categories.php
          php -l backend/api/posts.php
          php tests/firebase-auth.php
          npm run test:i18n
          REZAN_POSTS_FILE=tests/fixtures/multilingual-posts.json NEXT_PUBLIC_SITE_URL=https://example.com node scripts/verify-article-seo.mjs
